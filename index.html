<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社会科 論述力向上トレーニング</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --radius-xl: 20px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.7; padding: 36px 16px 80px; -webkit-font-smoothing: antialiased; }
    .container { max-width: 840px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    .header-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%); color: #1e40af; font-size: 0.82rem; font-weight: 800; padding: 6px 14px; border-radius: 9999px; margin-bottom: 12px; }
    header h1 { font-size: 2.1rem; font-weight: 900; color: #0f172a; letter-spacing: -0.03em; margin-bottom: 8px; }
    header p { color: var(--text-sub); font-size: 0.98rem; }
    .card { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); border: 1px solid rgba(226, 232, 240, 0.8); padding: 28px; margin-bottom: 24px; }
    .card-title { font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .step-badge { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; font-size: 0.76rem; padding: 4px 10px; border-radius: 8px; font-weight: 800; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { display: block; font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; color: #334155; }
    .required { color: #ef4444; margin-left: 2px; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 13px 16px; border: 1.8px solid #cbd5e1; border-radius: var(--radius-lg); font-size: 0.98rem; background-color: #ffffff; color: #0f172a; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    .field-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 14px 18px; background: #f8fafc; border: 1.8px solid #e2e8f0; border-radius: var(--radius-lg); font-weight: 800; font-size: 1rem; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .tab-btn:hover { background: #f1f5f9; color: #0f172a; transform: translateY(-1px); }
    .tab-btn.active { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; border-color: #1d4ed8; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3); }
    .problem-box { background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); border: 1.8px solid #e2e8f0; border-radius: var(--radius-lg); padding: 22px; margin-top: 14px; }
    .problem-tags { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tag { font-size: 0.8rem; background: #ffffff; color: #334155; padding: 4px 12px; border-radius: 9999px; font-weight: 700; border: 1px solid #e2e8f0; }
    .problem-question { font-size: 1.15rem; font-weight: 800; line-height: 1.7; color: #0f172a; margin-bottom: 16px; }

    /* アクションボタンバー（ヒント & 模範解答） */
    .problem-actions-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .toggle-hint-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: #fffbeb; color: #b45309; border: 1.5px solid #fde68a; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .toggle-hint-btn:hover { background: #fef3c7; transform: translateY(-1px); }
    .toggle-sample-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; background: #f0fdf4; color: #15803d; border: 1.5px solid #bbf7d0; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .toggle-sample-btn:hover { background: #dcfce7; transform: translateY(-1px); }

    /* ヒント表示ボックス */
    .hint-box { background: #fffbeb; border: 1.8px solid #fcd34d; border-radius: var(--radius-lg); padding: 16px; margin-top: 12px; animation: fadeIn 0.25s ease-out; }
    .hint-header { font-weight: 800; color: #92400e; font-size: 0.95rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .hint-keywords { font-size: 0.92rem; color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd; padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 10px; line-height: 1.5; font-weight: 600; }
    .hint-template { font-size: 0.94rem; color: #78350f; background: #ffffff; border: 1px solid #fde68a; padding: 12px 14px; border-radius: var(--radius-md); line-height: 1.7; white-space: pre-line; }

    /* 模範解答ボックス */
    .sample-answer-box { background: #f0fdf4; border: 1.8px solid #86efac; border-radius: var(--radius-lg); padding: 16px; margin-top: 12px; animation: fadeIn 0.25s ease-out; }
    .sample-answer-header { font-weight: 800; color: #166534; font-size: 0.95rem; margin-bottom: 8px; }
    .sample-answer-content { font-size: 0.96rem; color: #14532d; line-height: 1.7; background: #ffffff; padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid #bbf7d0; }

    .char-counter-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #64748b; margin-top: 10px; font-weight: 700; }
    .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; border: none; border-radius: var(--radius-lg); font-size: 1.15rem; font-weight: 900; cursor: pointer; box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35); margin-top: 8px; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45); }
    #result-container { display: none; border: 2px solid #3b82f6; }
    .rank-header { display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 22px; }
    .rank-A-box { background: #ecfdf5; border: 1.8px solid #a7f3d0; }
    .rank-B-box { background: #eff6ff; border: 1.8px solid #bfdbfe; }
    .rank-C-box { background: #fffbeb; border: 1.8px solid #fde68a; }
    .rank-D-box { background: #fef2f2; border: 1.8px solid #fecaca; }
    .rank-badge { font-size: 2.6rem; font-weight: 900; width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; flex-shrink: 0; }
    .rank-A-badge { background: #10b981; }
    .rank-B-badge { background: #3b82f6; }
    .rank-C-badge { background: #f59e0b; }
    .rank-D-badge { background: #ef4444; }
    .rank-title { font-size: 1.35rem; font-weight: 900; color: #0f172a; }
    .rank-subtitle { font-size: 0.85rem; color: #64748b; margin-top: 3px; }
    .feedback-section { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; }
    .fb-heading { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .fb-good { color: #059669; }
    .fb-improve { color: #d97706; }
    .fb-question { color: #4f46e5; }
    .fb-body { font-size: 0.96rem; line-height: 1.75; color: #1e293b; white-space: pre-line; }
    .retry-action { text-align: center; margin-top: 24px; }
    .retry-btn { padding: 14px 32px; background: #ffffff; border: 2px solid #2563eb; border-radius: var(--radius-lg); color: #2563eb; font-size: 1rem; font-weight: 800; cursor: pointer; }
    .retry-btn:hover { background: #2563eb; color: #ffffff; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-badge">✨ 学習指導要領準拠・全問ヒント＆模範解答付き</div>
    <h1>社会科 論述力向上トレーニング</h1>
    <p>問いに対する多面的な視点と論理的な記述力を育てるAI添削システム</p>
  </header>

  <form id="essay-form">
    <!-- STEP 1: 生徒情報 -->
    <div class="card">
      <div class="card-title">
        <span class="step-badge">STEP 1</span> 生徒情報を入力
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label for="student-class">クラス <span class="required">*</span></label>
          <select id="student-class" required>
            <option value="">選択してください</option>
            <option value="1組">1組</option>
            <option value="2組">2組</option>
            <option value="3組">3組</option>
            <option value="4組">4組</option>
            <option value="5組">5組</option>
          </select>
        </div>
        <div class="form-group">
          <label for="student-num">出席番号 <span class="required">*</span></label>
          <input type="number" id="student-num" min="1" max="50" placeholder="例: 12" required>
        </div>
        <div class="form-group">
          <label for="student-name">氏名 <span class="required">*</span></label>
          <input type="text" id="student-name" placeholder="例: 青山 翔" required>
        </div>
      </div>
    </div>

    <!-- STEP 2: 分野と問題を選択 -->
    <div class="card">
      <div class="card-title">
        <span class="step-badge">STEP 2</span> 分野と問題を選択
      </div>

      <div class="field-tabs">
        <button type="button" class="tab-btn" data-field="geography">🌏 地理的分野</button>
        <button type="button" class="tab-btn active" data-field="history">📜 歴史的分野</button>
        <button type="button" class="tab-btn" data-field="civics">🏛️ 公民的分野</button>
      </div>

      <div class="form-group">
        <label for="problem-select">演習問題を選択（時代・単元順）</label>
        <select id="problem-select"></select>
      </div>

      <div id="problem-card" class="problem-box">
        <div class="problem-tags" id="problem-tags"></div>
        <div class="problem-question" id="problem-question"></div>
        
        <!-- アクションボタン（ヒントを見る ＆ 模範解答を見る） -->
        <div class="problem-actions-bar">
          <button type="button" id="toggle-hint-btn" class="toggle-hint-btn">
            <span>🧩 書き方のヒントを見る（クリックで開く）</span>
          </button>
          <button type="button" id="toggle-sample-btn" class="toggle-sample-btn">
            <span>💡 模範解答例を見る</span>
          </button>
        </div>

        <!-- ヒント表示ボックス（クリックで開閉） -->
        <div id="hint-box" class="hint-box" style="display: none;">
          <div class="hint-header">🧩 論述の組み立てヒント</div>
          <div id="hint-keywords" class="hint-keywords"></div>
          <div id="hint-template" class="hint-template"></div>
        </div>

        <!-- 模範解答ボックス（クリックで開閉） -->
        <div id="sample-answer-box" class="sample-answer-box" style="display: none;">
          <div class="sample-answer-header">📖 模範解答例</div>
          <div id="sample-answer-text" class="sample-answer-content"></div>
        </div>
      </div>
    </div>

    <!-- STEP 3: 論述記述 -->
    <div class="card">
      <div class="card-title">
        <span class="step-badge">STEP 3</span> あなたの論述を記述
      </div>

      <div class="form-group">
        <label for="answer-input">解答入力欄 <span class="required">*</span></label>
        <textarea id="answer-input" rows="6" placeholder="ヒントを参考にしながら、理由や背景を「〜のため」「〜によって」などの言葉でつなげてまとめましょう..." required></textarea>
        <div class="char-counter-bar">
          <span id="char-guide">目安: 70〜160文字</span>
          <span>現在の文字数: <strong id="char-count">0</strong> 文字</span>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">
        <span>✨ AI添削を受ける ＆ 提出する</span>
      </button>
    </div>
  </form>

  <!-- 添削結果カード -->
  <div id="result-container" class="card">
    <div class="card-title">
      <span class="step-badge">RESULT</span> 添削・推敲フィードバック
    </div>

    <div id="rank-box" class="rank-header">
      <div id="rank-badge" class="rank-badge">A</div>
      <div>
        <div id="rank-title" class="rank-title">評価結果</div>
        <div id="rank-engine" class="rank-subtitle"></div>
      </div>
    </div>

    <div class="feedback-section">
      <div class="fb-heading fb-good">
        <span>👍</span> 良かった点（捉えられている視点）
      </div>
      <div id="fb-good-text" class="fb-body"></div>
    </div>

    <div class="feedback-section">
      <div class="fb-heading fb-improve">
        <span>💡</span> A判定にするためのアドバイス
      </div>
      <div id="fb-advice-text" class="fb-body"></div>
    </div>

    <div class="feedback-section">
      <div class="fb-heading fb-question">
        <span>❓</span> 自力で考えを深める推敲の問いかけ
      </div>
      <div id="fb-question-text" class="fb-body"></div>
    </div>

    <div class="retry-action">
      <button type="button" id="rewrite-btn" class="retry-btn">📝 このフィードバックをもとに再推敲（書き直す）</button>
    </div>
  </div>
</div>

<script src="problems.js"></script>
<script src="app.js"></script>
</body>
</html>
